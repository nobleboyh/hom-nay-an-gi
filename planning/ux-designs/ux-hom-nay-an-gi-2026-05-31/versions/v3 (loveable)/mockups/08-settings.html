<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hôm Nay Ăn Gì — Settings (v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; background: radial-gradient(ellipse 60% 50% at 10% 10%, oklch(0.62 0.14 38 / 0.14), transparent), radial-gradient(ellipse 50% 40% at 90% 90%, oklch(0.58 0.06 145 / 0.16), transparent); background-attachment: fixed; }
.phone { width: 360px; background: oklch(1 0 0); border-radius: 48px; box-shadow: 0 30px 80px -20px rgba(80,40,20,0.35); overflow: hidden; }
.status-bar { height: 48px; background: oklch(0.22 0.02 60); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; }
.content { padding: 12px 20px 20px; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.header .back { font-size: 20px; color: oklch(0.5 0.02 60); cursor: pointer; border: none; background: none; }
.header h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: oklch(0.22 0.02 60); }
.profile-card { display: flex; align-items: center; gap: 14px; padding: 14px; background: oklch(0.965 0.02 80); border-radius: 20px; margin-bottom: 20px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: oklch(0.62 0.14 38); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; font-family: 'Fraunces', serif; }
.profile-info .name { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: oklch(0.22 0.02 60); }
.profile-info .email { font-size: 12px; color: oklch(0.5 0.02 60); }
.settings-group { margin-bottom: 16px; }
.settings-label { font-size: 11px; font-weight: 600; color: oklch(0.5 0.02 60); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid oklch(0.88 0.018 70); cursor: pointer; }
.setting-row:last-child { border-bottom: none; }
.setting-left { display: flex; align-items: center; gap: 10px; }
.setting-icon { width: 28px; font-size: 16px; text-align: center; flex-shrink: 0; }
.setting-text { font-size: 13px; color: oklch(0.22 0.02 60); font-weight: 500; }
.setting-sub { font-size: 11px; color: oklch(0.5 0.02 60); }
.setting-right { font-size: 12px; color: oklch(0.5 0.02 60); }
.toggle { width: 44px; height: 24px; border-radius: 999px; background: oklch(0.62 0.14 38); border: none; cursor: pointer; position: relative; }
.toggle::after { content: ''; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #fff; top: 2px; right: 2px; }
.toggle.off { background: oklch(0.88 0.018 70); }
.toggle.off::after { right: auto; left: 2px; }
.bottom-nav { display: flex; height: 64px; background: oklch(1 0 0 / 0.95); backdrop-filter: blur(8px); border-top: 1px solid oklch(0.88 0.018 70); align-items: center; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: oklch(0.5 0.02 60); cursor: pointer; border: none; background: none; font-family: 'Inter', sans-serif; padding: 6px 0; }
.nav-item .icon { font-size: 20px; }
.nav-item.active { color: oklch(0.62 0.14 38); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content">
    <div class="header">
      <button class="back">←</button>
      <h2>Settings</h2>
    </div>

    <div class="profile-card">
      <div class="avatar">T</div>
      <div class="profile-info">
        <div class="name">Trần Minh</div>
        <div class="email">minh.tran@email.com</div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-label">Preferences</div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🌿</span><span class="setting-text">Dietary filters</span></div>
        <span class="setting-right">Vegetarian • Meat</span>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">⛔</span><span class="setting-text">Disliked ingredients</span></div>
        <span class="setting-right">2 items</span>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🌍</span><span class="setting-text">Cuisines</span></div>
        <span class="setting-right">Vietnamese, Asian</span>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🥜</span><span class="setting-text">Allergies</span></div>
        <span class="setting-right">Peanuts, Shellfish</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-label">App</div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🔔</span><span class="setting-text">Notifications</span></div>
        <button class="toggle"></button>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">📏</span><span class="setting-text">Units</span></div>
        <span class="setting-right">Metric (g, ml)</span>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🎨</span><span class="setting-text">Theme</span></div>
        <span class="setting-right">System</span>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-label">Account</div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🔒</span><span class="setting-text">Privacy</span></div>
        <span class="setting-right">▼</span>
      </div>
      <div class="setting-row">
        <div class="setting-left"><span class="setting-icon">🚪</span><span class="setting-text">Sign out</span></div>
      </div>
    </div>

    <p style="font-size:10px;color:oklch(0.5 0.02 60);text-align:center;padding:12px 0;">Hôm Nay Ăn Gì v1.0.0</p>
  </div>

  <div class="bottom-nav">
    <button class="nav-item"><span class="icon">🏠</span><span>Home</span></button>
    <button class="nav-item"><span class="icon">🔍</span><span>Discover</span></button>
    <button class="nav-item"><span class="icon">❤️</span><span>Favorites</span></button>
    <button class="nav-item active"><span class="icon">⚙</span><span>Settings</span></button>
  </div>
</div>
</body>
</html>
