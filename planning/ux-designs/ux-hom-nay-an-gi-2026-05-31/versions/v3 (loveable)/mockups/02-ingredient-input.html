<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hôm Nay Ăn Gì — Ingredient Input (v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 20px; background: radial-gradient(ellipse 60% 50% at 10% 10%, oklch(0.62 0.14 38 / 0.14), transparent), radial-gradient(ellipse 50% 40% at 90% 90%, oklch(0.58 0.06 145 / 0.16), transparent); background-attachment: fixed; }
.phone { width: 360px; background: oklch(1 0 0); border-radius: 48px; box-shadow: 0 30px 80px -20px rgba(80,40,20,0.35); overflow: hidden; }
.status-bar { height: 48px; background: oklch(0.22 0.02 60); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; }
.content { padding: 12px 20px 20px; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.header .back { font-size: 20px; color: oklch(0.5 0.02 60); cursor: pointer; border: none; background: none; }
.header h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: oklch(0.22 0.02 60); }
.section-label { font-size: 11px; font-weight: 600; color: oklch(0.5 0.02 60); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.input-wrap { display: flex; align-items: center; background: oklch(0.965 0.02 80); border: 1px solid oklch(0.88 0.018 70); border-radius: 20px; padding: 0 14px; height: 48px; margin-bottom: 8px; }
.input-wrap input { flex: 1; border: none; outline: none; font-size: 14px; color: oklch(0.22 0.02 60); background: transparent; font-family: 'Inter', sans-serif; }
.input-wrap input::placeholder { color: oklch(0.5 0.02 60); }
.input-wrap .icon-btn { width: 36px; height: 36px; border: none; background: none; font-size: 18px; cursor: pointer; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: oklch(0.5 0.02 60); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: oklch(0.58 0.06 145 / 0.15); color: oklch(0.58 0.06 145); font-size: 12px; font-weight: 500; }
.chip .close { width: 16px; height: 16px; border-radius: 50%; border: none; background: oklch(0.58 0.06 145 / 0.3); color: #fff; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag { padding: 6px 14px; border-radius: 999px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; background: oklch(0.94 0.015 80); color: oklch(0.5 0.02 60); }
.tag.active { background: oklch(0.62 0.14 38); color: #fff; }
.time-row { display: flex; gap: 6px; margin-bottom: 24px; }
.time-chip { padding: 8px 16px; border-radius: 20px; border: 1px solid oklch(0.88 0.018 70); background: oklch(1 0 0); color: oklch(0.5 0.02 60); font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif; }
.time-chip.active { background: oklch(0.62 0.14 38); color: #fff; border-color: oklch(0.62 0.14 38); }
.search-btn { width: 100%; height: 48px; border-radius: 20px; border: none; background: oklch(0.62 0.14 38); color: #fff; font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content">
    <div class="header">
      <button class="back">←</button>
      <h2>Ingredients</h2>
    </div>
    <div class="section-label">What's in your fridge?</div>
    <div class="input-wrap">
      <input type="text" placeholder="chicken, broccoli, eggs..." value="chicken, broccoli, eggs">
      <button class="icon-btn">🎤</button>
      <button class="icon-btn">📷</button>
    </div>
    <div class="chip-row">
      <div class="chip">Chicken 2× <button class="close">✕</button></div>
      <div class="chip">Broccoli 1× <button class="close">✕</button></div>
      <div class="chip">Eggs 3× <button class="close">✕</button></div>
    </div>
    <div class="section-label">Food type</div>
    <div class="tag-row">
      <button class="tag">Vegetarian</button>
      <button class="tag active">Meat</button>
      <button class="tag active">Light</button>
      <button class="tag">Vietnamese</button>
      <button class="tag">Sour</button>
    </div>
    <div class="section-label">Cook time</div>
    <div class="time-row">
      <button class="time-chip active">15 min</button>
      <button class="time-chip">30 min</button>
      <button class="time-chip">60 min</button>
      <button class="time-chip">90+ min</button>
    </div>
    <button class="search-btn">Find dishes</button>
  </div>
</div>
</body>
</html>
