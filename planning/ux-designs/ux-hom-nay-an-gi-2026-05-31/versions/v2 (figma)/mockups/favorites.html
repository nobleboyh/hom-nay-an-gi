<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hôm Nay Ăn Gì — Favorites (v2 Figma)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FFF8F0; display: flex; justify-content: center; padding: 20px; }
.phone { width: 390px; background: #FFF8F0; border-radius: 44px; box-shadow: 0 0 0 1px rgba(141,111,71,0.15), 0 8px 40px rgba(0,0,0,0.08); overflow: hidden; }
.status-bar { height: 48px; background: #FFF8F0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; color: #2D1810; font-weight: 600; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 8px 24px 4px; }
.header .back { width: 36px; height: 36px; border: none; background: none; font-size: 24px; cursor: pointer; color: #2D1810; }
.header h2 { font-size: 20px; font-weight: 600; color: #2D1810; flex: 1; }
.content { padding: 12px 24px; }
.search-bar { display: flex; align-items: center; background: #FFFBF5; border: 1px solid rgba(141,111,71,0.15); border-radius: 12px; padding: 0 12px; height: 44px; margin-bottom: 16px; }
.search-bar input { flex: 1; border: none; outline: none; font-size: 15px; color: #2D1810; background: transparent; font-family: inherit; }
.search-bar input::placeholder { color: #7D6B5A; }
.search-bar .icon { color: #7D6B5A; font-size: 18px; }
.fav-card { display: flex; align-items: center; gap: 14px; padding: 14px; background: #FFFFFF; border: 1px solid rgba(141,111,71,0.15); border-radius: 16px; margin-bottom: 10px; cursor: pointer; }
.fav-emoji { width: 48px; height: 48px; border-radius: 12px; background: #F5E6D3; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.fav-info { flex: 1; }
.fav-name { font-size: 15px; font-weight: 600; color: #2D1810; }
.fav-name-en { font-size: 12px; color: #7D6B5A; }
.fav-stats { display: flex; gap: 12px; margin-top: 4px; font-size: 12px; color: #7D6B5A; }
.fav-date { font-size: 11px; color: #7D6B5A; }
.fav-heart { font-size: 20px; color: #C94A3A; cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.empty h3 { font-size: 18px; color: #2D1810; margin-bottom: 6px; }
.empty p { font-size: 14px; color: #7D6B5A; margin-bottom: 16px; }
.empty .cta { padding: 12px 24px; border-radius: 12px; border: none; background: #D97036; color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; }
.tab-bar { display: flex; height: 64px; background: #FFFFFF; border-top: 1px solid rgba(141,111,71,0.15); align-items: center; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #7D6B5A; cursor: pointer; border: none; background: none; font-family: inherit; padding: 6px 0; }
.tab-item .tab-icon { font-size: 22px; }
.tab-item.active { color: #D97036; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="header">
    <button class="back">←</button>
    <h2>My Favorites (3)</h2>
  </div>
  <div class="content">
    <div class="search-bar">
      <span class="icon">🔍</span>
      <input type="text" placeholder="Search favorites...">
    </div>

    <div class="fav-card">
      <div class="fav-emoji">🍜</div>
      <div class="fav-info">
        <div class="fav-name">Phở Gà</div>
        <div class="fav-name-en">Chicken Pho</div>
        <div class="fav-stats"><span>⏱ 45 min</span><span>🔥 420 kcal</span></div>
      </div>
      <div class="fav-date">Saved 2 days ago</div>
      <span class="fav-heart">♥</span>
    </div>

    <div class="fav-card">
      <div class="fav-emoji">🥘</div>
      <div class="fav-info">
        <div class="fav-name">Gà Xào Bông Cải</div>
        <div class="fav-name-en">Chicken Stir-fry</div>
        <div class="fav-stats"><span>⏱ 25 min</span><span>🔥 380 kcal</span></div>
      </div>
      <div class="fav-date">Saved 5 days ago</div>
      <span class="fav-heart">♥</span>
    </div>

    <!-- Empty state (commented -- uncomment to preview)
    <div class="empty">
      <div class="icon">❤️</div>
      <h3>No favorites yet</h3>
      <p>Tap the heart icon on any dish to save it here</p>
      <button class="cta">Discover Dishes</button>
    </div>
    -->
  </div>

  <div class="tab-bar">
    <button class="tab-item"><span class="tab-icon">🏠</span><span>Home</span></button>
    <button class="tab-item"><span class="tab-icon">🔍</span><span>Discover</span></button>
    <button class="tab-item active"><span class="tab-icon">❤️</span><span>Favorites</span></button>
  </div>
</div>
</body>
</html>
