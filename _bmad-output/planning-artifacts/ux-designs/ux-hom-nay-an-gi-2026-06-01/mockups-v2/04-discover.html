<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hôm Nay Ăn Gì — Khám phá</title>
<link rel="stylesheet" href="./css/system.css">
</head>
<body>
<a href="#main-content" class="skip-link">Bỏ qua điều hướng → Nội dung chính</a>
<div class="app-shell">
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center" aria-hidden="true">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="1" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="3" width="10" height="6" rx="1" fill="currentColor"/></svg>
      <svg width="14" height="12" viewBox="0 0 14 12"><path d="M7 0C3.5 0 0 3 0 6s3.5 6 7 6 7-3 7-6-3.5-6-7-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z" fill="currentColor"/></svg>
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="1" fill="currentColor"/><rect x="14" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
    </span>
  </div>

  <main id="main-content" class="screen-content">
    <div class="section">
      <h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin:0">Khám phá</h1>
      <div class="flex items-center gap-sm mt-sm" style="padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)" role="region" aria-label="Vị trí hiện tại">
        <span aria-hidden="true">📍</span>
        <span style="flex:1;font-size:14px">Quận 1, TP. Hồ Chí Minh</span>
        <button class="btn-ghost" style="font-size:13px;min-height:44px" onclick="showToast('📍 Đang cập nhật vị trí...')" aria-label="Thay đổi vị trí">Thay đổi</button>
      </div>
    </div>

    <div class="chip-row" role="group" aria-label="Danh mục khám phá">
      <button class="chip chip-filled" role="button" aria-pressed="true">Tất cả</button>
      <button class="chip" role="button" aria-pressed="false">Đang thịnh hành</button>
      <button class="chip" role="button" aria-pressed="false">Gần tôi</button>
      <button class="chip" role="button" aria-pressed="false">Món mới</button>
      <button class="chip" role="button" aria-pressed="false">Đánh giá cao</button>
    </div>

    <div class="section">
      <div class="flex items-center justify-between mb-sm">
        <h2 class="section-title" style="margin-bottom:0">Đang thịnh hành 🔥</h2>
        <span class="text-sm">Trong bán kính 2km</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button class="dish-card" onclick="window.location.href='./03-recipe.html'" style="text-align:left;border:none;font-family:var(--font-body);width:100%;padding:0" tabindex="0">
          <div class="dish-card-img" aria-hidden="true"><span>📸</span></div>
          <div class="dish-card-body">
            <div class="dish-card-title">Phở bò</div>
            <div class="dish-card-sub">Quán Phở Hòa • ⭐ 4.5</div>
            <div class="dish-card-sub" style="margin-top:4px;color:var(--accent-strong);font-weight:600">45.000đ – 65.000đ</div>
          </div>
        </button>
        <button class="dish-card" onclick="window.location.href='./03-recipe.html'" style="text-align:left;border:none;font-family:var(--font-body);width:100%;padding:0" tabindex="0">
          <div class="dish-card-img" aria-hidden="true"><span>📸</span></div>
          <div class="dish-card-body">
            <div class="dish-card-title">Bún chả</div>
            <div class="dish-card-sub">Quán Bún Chả Hương Liên • ⭐ 4.3</div>
            <div class="dish-card-sub" style="margin-top:4px;color:var(--accent-strong);font-weight:600">35.000đ – 50.000đ</div>
          </div>
        </button>
        <button class="dish-card" onclick="window.location.href='./03-recipe.html'" style="text-align:left;border:none;font-family:var(--font-body);width:100%;padding:0" tabindex="0">
          <div class="dish-card-img" aria-hidden="true"><span>📸</span></div>
          <div class="dish-card-body">
            <div class="dish-card-title">Bánh mì thịt</div>
            <div class="dish-card-sub">Bánh Mì Huỳnh Hoa • ⭐ 4.7</div>
            <div class="dish-card-sub" style="margin-top:4px;color:var(--accent-strong);font-weight:600">25.000đ – 45.000đ</div>
          </div>
        </button>
        <button class="dish-card" onclick="window.location.href='./03-recipe.html'" style="text-align:left;border:none;font-family:var(--font-body);width:100%;padding:0" tabindex="0">
          <div class="dish-card-img" aria-hidden="true"><span>📸</span></div>
          <div class="dish-card-body">
            <div class="dish-card-title">Cà phê sữa đá</div>
            <div class="dish-card-sub">Cộng Cà Phê • ⭐ 4.2</div>
            <div class="dish-card-sub" style="margin-top:4px;color:var(--accent-strong);font-weight:600">15.000đ – 29.000đ</div>
          </div>
        </button>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Lọc theo</h2>
      <div class="chip-row multi" style="padding:0" role="group" aria-label="Ẩm thực">
        <button class="chip active" role="button" aria-pressed="true">🇻🇳 Việt Nam</button>
        <button class="chip" role="button" aria-pressed="false">🇨🇳 Trung Hoa</button>
        <button class="chip" role="button" aria-pressed="false">🇮🇹 Ý</button>
        <button class="chip" role="button" aria-pressed="false">🇯🇵 Nhật</button>
        <button class="chip" role="button" aria-pressed="false">🇰🇷 Hàn</button>
      </div>
      <div class="chip-row multi" style="padding:0;margin-top:8px" role="group" aria-label="Khoảng giá">
        <button class="chip active" role="button" aria-pressed="true">Dưới 50k</button>
        <button class="chip" role="button" aria-pressed="false">50k – 100k</button>
        <button class="chip" role="button" aria-pressed="false">100k – 200k</button>
        <button class="chip" role="button" aria-pressed="false">Trên 200k</button>
      </div>
    </div>

    <div class="section">
      <div class="flex items-center justify-between mb-sm">
        <h2 class="section-title" style="margin-bottom:0">Gần tôi</h2>
        <span class="text-sm">Xem tất cả</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="card-flat flex gap-md" style="cursor:pointer;text-align:left;border:none;font-family:var(--font-body);width:100%" onclick="window.location.href='./03-recipe.html'" tabindex="0">
          <div class="placeholder-img" style="width:80px;height:80px;aspect-ratio:1;border-radius:var(--radius-sm);flex-shrink:0" aria-hidden="true"><span>📸</span></div>
          <div style="flex:1">
            <div style="font-weight:600;line-height:1.3">Bún bò Huế</div>
            <div class="text-sm">Quán Bà Đỏ • 0.8km</div>
            <div class="text-sm" style="margin-top:2px">⭐ 4.4 • 40.000đ</div>
          </div>
        </button>
        <button class="card-flat flex gap-md" style="cursor:pointer;text-align:left;border:none;font-family:var(--font-body);width:100%" onclick="window.location.href='./03-recipe.html'" tabindex="0">
          <div class="placeholder-img" style="width:80px;height:80px;aspect-ratio:1;border-radius:var(--radius-sm);flex-shrink:0" aria-hidden="true"><span>📸</span></div>
          <div style="flex:1">
            <div style="font-weight:600;line-height:1.3">Cơm tấm sườn</div>
            <div class="text-sm">Cơm Tấm Bụi • 1.2km</div>
            <div class="text-sm" style="margin-top:2px">⭐ 4.6 • 35.000đ</div>
          </div>
        </button>
        <button class="card-flat flex gap-md" style="cursor:pointer;text-align:left;border:none;font-family:var(--font-body);width:100%" onclick="window.location.href='./03-recipe.html'" tabindex="0">
          <div class="placeholder-img" style="width:80px;height:80px;aspect-ratio:1;border-radius:var(--radius-sm);flex-shrink:0" aria-hidden="true"><span>📸</span></div>
          <div style="flex:1">
            <div style="font-weight:600;line-height:1.3">Gỏi cuốn</div>
            <div class="text-sm">Ốc Đào • 1.5km</div>
            <div class="text-sm" style="margin-top:2px">⭐ 4.3 • 25.000đ</div>
          </div>
        </button>
      </div>
    </div>
  </main>

  <nav class="tab-bar" role="navigation" aria-label="Điều hướng chính">
    <button class="tab-item" data-tab="home" onclick="window.location.href='./01-home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Trang chủ</span>
    </button>
    <button class="tab-item active" data-tab="discover" onclick="window.location.href='./04-discover.html'" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span>Khám phá</span>
    </button>
    <button class="tab-item" data-tab="favorites" onclick="window.location.href='./05-favorites.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      <span>Yêu thích</span>
    </button>
    <button class="tab-item" data-tab="profile" onclick="window.location.href='./07-login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Cá nhân</span>
    </button>
  </nav>
</div>
<script src="./js/screens.js"></script>
</body>
</html>
