    <div class="top-bar">
      <div class="top-bar-left">
        <button class="btn-back" onclick="window.location.href='./01-home.html'" aria-label="Quay lại">‹</button>

      </div>
      <span class="text-sm">gà, bông cải, trứng</span>
    </div>

      <select class="input-field" style="width:auto;padding:10px 16px;font-size:13px;border-radius:100px;min-height:44px" aria-label="Sắp xếp theo">

        <option>Nấu nhanh nhất</option>

      <div class="result-card expanded">
        <button class="result-card-header" onclick="var p=this.parentElement;p.classList.toggle('expanded');this.setAttribute('aria-expanded',p.classList.contains('expanded'))" aria-expanded="true" style="width:100%;border:none;background:none;cursor:pointer;font-family:var(--font-body);text-align:left" tabindex="0">
          <div>
            <div style="font-weight:600;font-size:16px;line-height:1.3">Gà xào bông cải</div>
            <div class="text-sm" style="margin-top:2px">Việt Nam • 25 phút • 380 kcal</div>
          </div>
          <span class="match-badge" aria-label="Phù hợp 95%">95%</span>
        </button>
        <div class="result-card-body" role="region" aria-label="Chi tiết món Gà xào bông cải">
          <div class="placeholder-img mb-sm" aria-hidden="true">
            <span>📸 Ảnh món Gà xào bông cải</span>
          </div>
          <div class="flex items-center justify-between mb-sm">
            <div class="flex gap-sm items-center" role="group" aria-label="Phân loại món">

              <span class="chip" style="padding:8px 14px;min-height:auto">Có thịt</span>

          </div>
        </div>
      </div>

            <button class="btn btn-primary flex-1" onclick="window.location.href='./03-recipe.html'">Xem công thức</button>
