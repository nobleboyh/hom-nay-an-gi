<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hôm Nay Ăn Gì — Trang chủ</title>
<link rel="stylesheet" href="./css/system.css">
</head>
<body>
<a href="#main-content" class="skip-link">Bỏ qua điều hướng → Nội dung chính</a>
<div class="app-shell">
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center" aria-hidden="true">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="1" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="3" width="10" height="6" rx="1" fill="currentColor"/></svg>
      <svg width="14" height="12" viewBox="0 0 14 12"><path d="M7 0C3.5 0 0 3 0 6s3.5 6 7 6 7-3 7-6-3.5-6-7-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z" fill="currentColor"/></svg>
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="1" fill="currentColor"/><rect x="14" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
    </span>
  </div>

  <main id="main-content" class="screen-content">
    <div class="section text-center" style="padding-top:16px">
      <h1 style="font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.2">
        🥘 Hôm Nay<br>Ăn Gì?
      </h1>
      <p class="text-sm mt-sm">Nhập nguyên liệu bạn có — để tôi gợi ý món ngon</p>
    </div>

    <div class="section" style="padding-top:0">
      <div style="position:relative">
        <input type="text" class="input-field" id="ingredient-input" placeholder="Gõ nguyên liệu, ví dụ: thịt gà, bông cải, trứng" aria-label="Nhập nguyên liệu" style="padding-right:90px">
        <div style="position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:4px">
          <button class="btn-ghost" style="font-size:18px" onclick="showToast('🎤 Đang nghe...')" aria-label="Nhập bằng giọng nói" tabindex="0">🎤</button>
          <button class="btn-ghost" style="font-size:18px" onclick="showToast('📷 Mở camera')" aria-label="Nhập bằng camera" tabindex="0">📷</button>
        </div>
      </div>
    </div>

    <div class="section" style="padding-top:0;padding-bottom:8px" id="ingredient-chips" aria-label="Nguyên liệu đã nhập">
      <div class="flex" style="flex-wrap:wrap;gap:8px">
        <span class="ingredient-chip" role="listitem">Thịt gà <button class="remove" onclick="this.parentElement.remove()" aria-label="Xoá Thịt gà">✕</button></span>
        <span class="ingredient-chip" role="listitem">Bông cải <button class="remove" onclick="this.parentElement.remove()" aria-label="Xoá Bông cải">✕</button></span>
        <span class="ingredient-chip" role="listitem">Trứng <button class="remove" onclick="this.parentElement.remove()" aria-label="Xoá Trứng">✕</button></span>
      </div>
    </div>

    <div class="section" style="padding-bottom:8px;padding-top:8px">
      <h2 class="section-title">Loại món</h2>
      <div class="chip-row multi" style="padding:0" role="group" aria-label="Loại món">
        <button class="chip" role="button" aria-pressed="false">Tất cả</button>
        <button class="chip active" role="button" aria-pressed="true">Có thịt</button>
        <button class="chip" role="button" aria-pressed="false">Chay</button>
        <button class="chip" role="button" aria-pressed="false">Salad</button>
        <button class="chip" role="button" aria-pressed="false">Nhẹ</button>
        <button class="chip" role="button" aria-pressed="false">Mặn</button>
        <button class="chip" role="button" aria-pressed="false">Ngọt</button>
        <button class="chip" role="button" aria-pressed="false">Tráng miệng</button>
      </div>
    </div>

    <div class="section" style="padding-bottom:8px;padding-top:0">
      <div class="flex items-center justify-between">
        <h2 class="section-title" style="margin-bottom:0">Ẩm thực</h2>
      </div>
      <div class="chip-row multi" style="padding:0;margin-top:8px" role="group" aria-label="Ẩm thực">
        <button class="chip active" role="button" aria-pressed="true">Việt Nam</button>
        <button class="chip" role="button" aria-pressed="false">Trung Hoa</button>
        <button class="chip" role="button" aria-pressed="false">Ý</button>
        <button class="chip" role="button" aria-pressed="false">Tây</button>
      </div>
    </div>

    <div class="section" style="padding-bottom:8px;padding-top:0">
      <div class="collapsible">
        <button class="collapsible-header" aria-expanded="false" style="padding:8px 0">
          <h2 class="section-title" style="margin-bottom:0">Cảm giác thèm</h2>
          <span style="color:var(--muted);font-size:18px" aria-hidden="true">▾</span>
        </button>
        <div class="collapsible-body" style="padding:0">
          <div class="chip-row multi" style="padding:0" role="group" aria-label="Cảm giác thèm">
            <button class="chip" role="button" aria-pressed="false">Đồ ăn thoải mái</button>
            <button class="chip" role="button" aria-pressed="false">Mát lạnh</button>
            <button class="chip" role="button" aria-pressed="false">Cay</button>
            <button class="chip" role="button" aria-pressed="false">Xa xỉ</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section" style="padding-bottom:8px;padding-top:0">
      <h2 class="section-title">Thời gian nấu</h2>
      <div class="chip-row" style="padding:0" role="group" aria-label="Thời gian nấu">
        <button class="chip" role="button" aria-pressed="false">15 phút</button>
        <button class="chip active" role="button" aria-pressed="true">30 phút</button>
        <button class="chip" role="button" aria-pressed="false">60 phút</button>
        <button class="chip" role="button" aria-pressed="false">90+ phút</button>
      </div>
    </div>

    <div class="section" style="display:flex;gap:12px;padding-top:8px">
      <button class="btn btn-primary btn-lg flex-1" onclick="window.location.href='./02-results.html'">
        Tìm món
      </button>
      <button class="btn btn-secondary btn-lg" onclick="window.location.href='./02-results.html'" style="flex-shrink:0">
        Bất ngờ!
      </button>
    </div>
  </main>

  <nav class="tab-bar" role="navigation" aria-label="Điều hướng chính">
    <button class="tab-item active" data-tab="home" onclick="window.location.href='./01-home.html'" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Trang chủ</span>
    </button>
    <button class="tab-item" data-tab="discover" onclick="window.location.href='./04-discover.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span>Khám phá</span>
    </button>
    <button class="tab-item" data-tab="favorites" onclick="window.location.href='./05-favorites.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      <span>Yêu thích</span>
    </button>
    <button class="tab-item" data-tab="profile" onclick="window.location.href='./07-login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Cá nhân</span>
    </button>
  </nav>
</div>
<script src="./js/screens.js"></script>
</body>
</html>
