<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hôm Nay Ăn Gì — Đăng nhập</title>
<link rel="stylesheet" href="./css/system.css">
</head>
<body>
<div class="app-shell">
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center">
      <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="1" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="3" width="10" height="6" rx="1" fill="currentColor"/></svg>
      <svg width="14" height="12" viewBox="0 0 14 12"><path d="M7 0C3.5 0 0 3 0 6s3.5 6 7 6 7-3 7-6-3.5-6-7-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z" fill="currentColor"/></svg>
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="1" fill="currentColor"/><rect x="14" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="screen-content">
    <div style="padding:var(--space-xl) var(--space-md);text-align:center">
      <div style="font-size:48px;margin-bottom:var(--space-sm)">🥘</div>
      <h1 style="font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-0.02em">Hôm Nay Ăn Gì</h1>
      <p class="text-sm mt-sm" style="max-width:280px;margin:8px auto 0">Đăng nhập để lưu món yêu thích và đồng bộ dữ liệu của bạn</p>
    </div>

    <div class="section" style="padding-top:0">
      <div class="mb-sm">
        <label class="text-sm mb-sm" style="display:block">Email</label>
        <input type="email" class="input-field" placeholder="your@email.com" id="login-email">
      </div>
      <div class="mb-md">
        <label class="text-sm mb-sm" style="display:block">Mật khẩu</label>
        <input type="password" class="input-field" placeholder="••••••••" id="login-password">
      </div>
      <button class="btn btn-primary btn-full btn-lg" onclick="handleLogin()">
        Đăng nhập
      </button>
      <div class="flex items-center justify-center mt-md" style="gap:12px">
        <span style="flex:1;height:1px;background:var(--border)"></span>
        <span class="text-sm">hoặc</span>
        <span style="flex:1;height:1px;background:var(--border)"></span>
      </div>
      <button class="btn btn-secondary btn-full mt-md" onclick="handleGuest()">
        Tiếp tục mà không đăng nhập
      </button>
    </div>

    <div class="section text-center">
      <p class="text-sm">Chưa có tài khoản? <a href="#" onclick="showToast('📝 Chức năng đăng ký sẽ có trong phiên bản tiếp theo')" style="color:var(--accent);text-decoration:none;font-weight:600">Đăng ký</a></p>
    </div>

    <div class="section">
      <div class="card" style="background:var(--accent-dim);border-color:var(--accent)">
        <div style="font-weight:600;font-size:14px">🔒 Lợi ích đăng nhập</div>
        <ul style="margin-top:8px;font-size:13px;color:var(--fg);padding-left:18px;display:flex;flex-direction:column;gap:4px">
          <li>Đồng bộ món yêu thích trên mọi thiết bị</li>
          <li>Gợi ý thông minh hơn dựa trên lịch sử</li>
          <li>Lưu danh sách mua sắm để dùng lại</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-item" data-tab="home" onclick="window.location.href='./01-home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Trang chủ</span>
    </button>
    <button class="tab-item" data-tab="discover" onclick="window.location.href='./04-discover.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span>Khám phá</span>
    </button>
    <button class="tab-item" data-tab="favorites" onclick="window.location.href='./05-favorites.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      <span>Yêu thích</span>
    </button>
    <button class="tab-item active" data-tab="profile" onclick="window.location.href='./07-login.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Cá nhân</span>
    </button>
  </div>
</div>
<script src="./js/screens.js"></script>
<script>
function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pwd = document.getElementById('login-password').value.trim();
  if (!email || !pwd) {
    showToast('⚠️ Vui lòng nhập email và mật khẩu');
    return;
  }
  showToast('✅ Đăng nhập thành công!');
  setTimeout(() => window.location.href = './01-home.html', 800);
}
function handleGuest() {
  showToast('👋 Tiếp tục với tư cách khách');
  localStorage.setItem('hnae-guest', 'true');
  setTimeout(() => window.location.href = './01-home.html', 500);
}
</script>
</body>
</html>
