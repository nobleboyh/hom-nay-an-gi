<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hôm Nay Ăn Gì — Home (v3 Loveable)</title>
<!-- DESIGN: Editorial cookbook feel. Fraunces serif headlines, Inter body, clay + sage + cream palette. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 20px;
  background: radial-gradient(ellipse 60% 50% at 10% 10%, oklch(0.62 0.14 38 / 0.14), transparent),
              radial-gradient(ellipse 50% 40% at 90% 90%, oklch(0.58 0.06 145 / 0.16), transparent);
  background-attachment: fixed;
}
.phone {
  width: 360px; background: oklch(1 0 0); border-radius: 48px;
  box-shadow: 0 30px 80px -20px rgba(80,40,20,0.35); overflow: hidden;
  position: relative;
}
.status-bar { height: 48px; background: oklch(0.22 0.02 60); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; }
.content { padding: 12px 20px 20px; background: fixed radial-gradient(ellipse 70% 40% at 0% 0%, oklch(0.62 0.14 38 / 0.08), transparent); }
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.header-text { }
.header .brand { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: oklch(0.22 0.02 60); line-height: 1.1; }
.header .brand em { font-style: italic; }
.header .sub { font-size: 12px; color: oklch(0.5 0.02 60); margin-top: 2px; }
.header .lang-toggle { font-size: 11px; color: oklch(0.5 0.02 60); background: oklch(0.94 0.015 80); padding: 4px 10px; border-radius: 999px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
.surprise-btn {
  width: 100%; height: 64px; border-radius: 20px; border: none;
  background: oklch(0.62 0.14 38); color: #fff;
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 20px; cursor: pointer;
  box-shadow: 0 4px 12px oklch(0.62 0.14 38 / 0.35);
}
.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.quick-card {
  background: oklch(1 0 0); border: 1px solid oklch(0.88 0.018 70);
  border-radius: 20px; padding: 16px; cursor: pointer; text-align: center;
}
.quick-card .icon { font-size: 28px; margin-bottom: 6px; }
.quick-card .label { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: oklch(0.22 0.02 60); }
.quick-card .desc { font-size: 11px; color: oklch(0.5 0.02 60); margin-top: 2px; }
.section-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: oklch(0.22 0.02 60); margin-bottom: 12px; }
.trending-list { }
.trend-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid oklch(0.88 0.018 70); }
.trend-item:last-child { border-bottom: none; }
.trend-rank { width: 24px; font-family: 'Fraunces', serif; font-size: 14px; font-weight: 700; color: oklch(0.62 0.14 38); }
.trend-img { width: 44px; height: 44px; border-radius: 12px; background: oklch(0.94 0.015 80); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.trend-info { flex: 1; }
.trend-name { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600; color: oklch(0.22 0.02 60); }
.trend-meta { font-size: 11px; color: oklch(0.5 0.02 60); margin-top: 1px; }
.bottom-nav { display: flex; height: 64px; background: oklch(1 0 0 / 0.95); backdrop-filter: blur(8px); border-top: 1px solid oklch(0.88 0.018 70); align-items: center; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: oklch(0.5 0.02 60); cursor: pointer; border: none; background: none; font-family: 'Inter', sans-serif; padding: 6px 0; }
.nav-item .icon { font-size: 20px; }
.nav-item.active { color: oklch(0.62 0.14 38); }
.nav-item.active .icon { font-weight: 700; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content">
    <div class="header">
      <div class="header-text">
        <div class="brand">Hôm Nay <em>Ăn Gì</em></div>
        <div class="sub">What to Eat Today</div>
      </div>
      <button class="lang-toggle">VI / EN</button>
    </div>

    <button class="surprise-btn"><span>🎲</span> Surprise me</button>

    <div class="grid-2col">
      <div class="quick-card">
        <div class="icon">🔍</div>
        <div class="label">Ingredients</div>
        <div class="desc">What's in the fridge?</div>
      </div>
      <div class="quick-card">
        <div class="icon">📍</div>
        <div class="label">Nearby</div>
        <div class="desc">Discover close by</div>
      </div>
    </div>

    <div class="section-title">Trending now</div>
    <div class="trending-list">
      <div class="trend-item">
        <span class="trend-rank">1</span>
        <div class="trend-img">🍜</div>
        <div class="trend-info">
          <div class="trend-name">Phở gà</div>
          <div class="trend-meta">📍 350m · ⭐ 4.5 · $$</div>
        </div>
      </div>
      <div class="trend-item">
        <span class="trend-rank">2</span>
        <div class="trend-img">🥩</div>
        <div class="trend-info">
          <div class="trend-name">Bún thịt nướng</div>
          <div class="trend-meta">📍 1.2 km · ⭐ 4.3 · $$</div>
        </div>
      </div>
      <div class="trend-item">
        <span class="trend-rank">3</span>
        <div class="trend-img">🥗</div>
        <div class="trend-info">
          <div class="trend-name">Gỏi cuốn</div>
          <div class="trend-meta">📍 800 m · ⭐ 4.7 · $</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active"><span class="icon">🏠</span><span>Home</span></button>
    <button class="nav-item"><span class="icon">🔍</span><span>Discover</span></button>
    <button class="nav-item"><span class="icon">❤️</span><span>Favorites</span></button>
    <button class="nav-item"><span class="icon">⚙</span><span>Settings</span></button>
  </div>
</div>
</body>
</html>
